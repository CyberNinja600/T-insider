# =====================================================================
# T-Insider Dynamic UI Component Color Mapping Configurations
# =====================================================================
# This configuration file decouples every dynamic UI element color layer,
# allowing you to customize which plist theme keys map to which specific components.
# Change the right-hand values to any valid key in your loaded .terminal plist files.

# ---------------------------------------------------------------------
# 1. Main Window & Shell Containers
# ---------------------------------------------------------------------
# Background color of the main undecorated window
app.window.background=SelectionColor
# Color of the thin 1px border wrapping the borderless window
app.window.border=SelectionColor
# Drag-to-move header bar background
titlebar.background=SelectionColor
# Drag-to-move header bar bottom divider line
titlebar.border=SelectionColor
# Top shell selection action bar background
toolbar.background=SelectionColor
# Top shell selection action bar bottom divider line
toolbar.border=SelectionColor
# Left directory list navigation panel background
sidebar.background=SelectionColor
# Left division line separating lists from the terminal console
sidebar.border=SelectionColor
# Left sidebar navigation button standard text color
sidebar.nav.foreground=TextColor
# Left sidebar navigation button background when hovered
sidebar.nav.hover.background=CursorColor
# Left sidebar navigation button text color when hovered
sidebar.nav.hover.foreground=BackgroundColor
# Left sidebar navigation button background when active/selected
sidebar.nav.selected.background=CursorColor
# Opacity of left sidebar navigation button background when active/selected (Float value from 0.0 to 1.0)
sidebar.nav.selected.background.opacity=.150
# Left sidebar navigation button left-accent indicator border color when selected
sidebar.nav.selected.border=CursorColor
# Default color of standard user-interface label text
global.label.foreground=TextColor

# ---------------------------------------------------------------------
# 2. Terminal Console (JediTerm Shell Panel)
# ---------------------------------------------------------------------
# Background of the core active terminal text canvas
terminal.background=BackgroundColor
# Default color of general system output / user typing characters
terminal.foreground=TextColor
# Color of the solid cursor caret (block/line)
terminal.cursor=CursorColor
# Background highlighting of selected terminal characters
terminal.selection=SelectionColor

# ---------------------------------------------------------------------
# 3. Terminal Tab Workspace (Central Headers)
# ---------------------------------------------------------------------
# The background region behind all tab nodes
tabs.header.background=SelectionColor
# Inactive tab background
tabs.tab.inactive.background=SelectionColor
# Inactive tab label text color
tabs.tab.inactive.foreground=TextColor
# Active selected tab background
tabs.tab.active.background=BackgroundColor
# Active selected tab label text color
tabs.tab.active.foreground=CursorColor
# Solid color stripe highlighting the active tab's top edge
tabs.tab.active.border=CursorColor
# Inactive tab background when hovered
tabs.tab.hover.background=BackgroundColor
# Central "+" icon color to open a local terminal
tabs.plus.foreground=TextColor
# Hover background box for the "+" button
tabs.plus.hover.background=SelectionColor
# Hover outline color for the "+" button
tabs.plus.hover.foreground=CursorColor

# ---------------------------------------------------------------------
# 4. Host & Snippet Cards (Sidebar List Nodes)
# ---------------------------------------------------------------------
# Scrollable list container backgrounds
cards.list.background=SelectionColor
# Border wrapping list containers
cards.list.border=SelectionColor
# Default backdrop of unselected list cards
cards.item.background=BackgroundColor
# Opacity of the default card background (Float value from 0.0 to 1.0)
cards.item.background.opacity=.5
# Default border of unselected list cards
cards.item.border=SelectionColor
# Opacity of the default card border (Float value from 0.0 to 1.0)
cards.item.border.opacity=1.0
# Label text color for host profiles / snippet titles
cards.item.title=TextColor
# Code previews and user@ip subtext color
cards.item.subtext=TextColor
# Circular initial-badges logo backgrounds
cards.item.badge.background=BackgroundColor
# Circular initial-badges character text color
cards.item.badge.foreground=TextColor
# Background color of badges when the card is hovered
cards.item.badge.hover.background=SelectionColor
# Text color of badges when the card is hovered
cards.item.badge.hover.foreground=CursorColor
# Opacity of the hover badge background (Float value from 0.0 to 1.0)
cards.item.badge.hover.opacity=1
# Background color of badges when the card is selected
cards.item.badge.selected.background=SelectionColor
# Text color of badges when the card is selected
cards.item.badge.selected.foreground=CursorColor
# Opacity of the selected badge background (Float value from 0.0 to 1.0)
cards.item.badge.selected.opacity=1.0
# Opacity of the standard badge background (Float value from 0.0 to 1.0)
cards.item.badge.opacity=0.15
# Card background when hovered
cards.item.hover.background=CursorColor
# Opacity of the card background when hovered (Float value from 0.0 to 1.0)
cards.item.hover.background.opacity=.15
# Card outline border when hovered
cards.item.hover.border=CursorColor
# Opacity of the card border when hovered (Float value from 0.0 to 1.0)
cards.item.hover.border.opacity=1.0
# Card background when selected
cards.item.selected.background=BackgroundColor
# Opacity of the card background when selected (Float value from 0.0 to 1.0)
cards.item.selected.background.opacity=1.0
# Card outline border when selected
cards.item.selected.border=CursorColor
# Opacity of the card border when selected (Float value from 0.0 to 1.0)
cards.item.selected.border.opacity=1.0
# Glowing dropshadow neon color around selected card boundaries
cards.item.selected.glow=CursorColor

# ---------------------------------------------------------------------
# 5. Form Input Controls (Inputs, Buttons, Dropdowns)
# ---------------------------------------------------------------------
# Action button backgrounds
controls.button.background=BackgroundColor
# Action button outline borders
controls.button.border=BackgroundColor
# Action button labels text color
controls.button.foreground=TextColor
# Action button hover backdrop
controls.button.hover.background=CursorColor
# Combobox selection input background
controls.combo.background=BackgroundColor
# Combobox outline border
controls.combo.border=SelectionColor
# Combobox text color
controls.combo.foreground=TextColor
# Text input fields backdrop (Host edit username, IP text boxes)
controls.input.background=SelectionColor
# Text input fields outline border
controls.input.border=BackgroundColor
# Text input fields typing characters color
controls.input.foreground=TextColor

# ---------------------------------------------------------------------
# 5b. Search Bar Controls
# ---------------------------------------------------------------------
# Search bar input field background color
search.bar.background=BackgroundColor
# Search bar input field outline border
search.bar.border=SelectionColor
# Search bar input field typing/placeholder characters color
search.bar.foreground=CursorColor
# Search bar input field hover backdrop
search.bar.hover.background=BackgroundColor
# Search bar input field active/focused outline border
search.bar.active.border=CursorColor
# Search bar input field active/focused background color
search.bar.active.background=BackgroundColor
# Opacity of the search bar default background (Float value from 0.0 to 1.0)
search.bar.background.opacity=.5

# ---------------------------------------------------------------------
# 6. Dropdown Popups & Context Menus
# ---------------------------------------------------------------------
# Popup overlay list backgrounds (Combobox options, tab list scroll drop)
dropdown.list.background=BackgroundColor
# Outline border wrapping popup overlays
dropdown.list.border=SelectionColor
# Unfocused dropdown options backgrounds
dropdown.item.background=SelectionColor
# Unfocused dropdown option text color
dropdown.item.foreground=TextColor
# Dropdown option background when hovered
dropdown.item.hover.background=BackgroundColor
# Dropdown option text color when hovered
dropdown.item.hover.foreground=CursorColor

# ---------------------------------------------------------------------
# 7. Undecorated Window Title Controls (Minimize, Maximize, Close)
# ---------------------------------------------------------------------
# Default idle color of window controls (Min/Max/Close icons)
titlebar.button.foreground=TextColor
# Hover background for Minimize and Maximize button boundaries
titlebar.button.hover.background=SelectionColor
# Hover icon color for Minimize and Maximize SVGs
titlebar.button.hover.foreground=CursorColor
# Hover background for the Close button (standard crimson red)
titlebar.close.hover.background=CursorColor
# Hover icon color for the Close SVG
titlebar.close.hover.foreground=TextColor


snippetLauncher.label = CursorColor

# ---------------------------------------------------------------------
# 8. Snippet Dashboard Packages Sections
# ---------------------------------------------------------------------
# Background of the package sections folders in Dashboard
dashboard.package.background=SelectionColor
# Opacity of the package sections backdrop (Float value from 0.0 to 1.0)
dashboard.package.background.opacity=0.3
# Border wrapping the package folder sections
dashboard.package.border=SelectionColor
# Opacity of the package section border (Float value from 0.0 to 1.0)
dashboard.package.border.opacity=1.0

# ---------------------------------------------------------------------
# 9. Centralized Scrollbar Styling
# ---------------------------------------------------------------------
# Background color of the scrollbar thumb
scrollbar.thumb=CursorColor
# Opacity of the scrollbar thumb (Float value from 0.0 to 1.0)
scrollbar.thumb.opacity=0.3
# Background color of the scrollbar thumb when hovered
scrollbar.thumb.hover=CursorColor
# Opacity of the hovered scrollbar thumb (Float value from 0.0 to 1.0)
scrollbar.thumb.hover.opacity=0.6

# ---------------------------------------------------------------------
# 9b. Dropdown Popup Scrollbar Styling
# ---------------------------------------------------------------------
# Background color of the dropdown scrollbar thumb (entirely different property from terminal scrollbar)
dropdown.scrollbar.thumb=SelectionColor
# Opacity of the dropdown scrollbar thumb (Float value from 0.0 to 1.0)
dropdown.scrollbar.thumb.opacity=0.4
# Background color of the dropdown scrollbar thumb when hovered
dropdown.scrollbar.thumb.hover=CursorColor
# Opacity of the hovered dropdown scrollbar thumb (Float value from 0.0 to 1.0)
dropdown.scrollbar.thumb.hover.opacity=0.7

# ---------------------------------------------------------------------
# 10. Dialog / Modal Windows
# ---------------------------------------------------------------------
# Background color of the dialog window
dialog.background=SelectionColor
# Opacity of the dialog background (Float value from 0.0 to 1.0)
dialog.background.opacity=1.0
# Border color around dialog panes
dialog.border=CursorColor
# Opacity of the dialog border (Float value from 0.0 to 1.0)
dialog.border.opacity=1.0
# Background color of the dialog header section
dialog.header.background=BackgroundColor
# Opacity of the dialog header section (Float value from 0.0 to 1.0)
dialog.header.background.opacity=0.5
# Text color of the dialog header title
dialog.header.foreground=CursorColor

# ---------------------------------------------------------------------
# 11. Partitioned Terminal Pane (Split Headers & Placeholder Messages)
# ---------------------------------------------------------------------
# Background of the partitioned terminal pane
terminal.pane.background=BackgroundColor
# Border wrapping partitioned panes (indicating split boundaries)
terminal.pane.border=CursorColor
# Background of the partition header bar
terminal.pane.header.background=BackgroundColor
# Bottom border dividing the partition header bar
terminal.pane.header.border=BackgroundColor
# Title text color in partition headers
terminal.pane.header.foreground=TextColor
# Text color of action buttons (Split, Close) in partition headers
terminal.pane.header.button.foreground=BackgroundColor
# Hover background for standard action buttons
terminal.pane.header.button.hover.background=SelectionColor
# Hover text color for standard action buttons
terminal.pane.header.button.hover.foreground=CursorColor

# Empty partition placeholder container background
terminal.pane.empty.background=SelectionColor
# Empty partition placeholder dashed border color
terminal.pane.empty.border=CursorColor
# Main "Drop Tab Here" text color
terminal.pane.empty.title=CursorColor
# Help description text color in empty partition
terminal.pane.empty.description=TextColor
# "Or Open Local CMD" button background
terminal.pane.empty.button.background=SelectionColor
# "Or Open Local CMD" button text color
terminal.pane.empty.button.foreground=TextColor
# "Or Open Local CMD" button hover background
terminal.pane.empty.button.hover.background=CursorColor
# "Or Open Local CMD" button hover text color
terminal.pane.empty.button.hover.foreground=BackgroundColor




